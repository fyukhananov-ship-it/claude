# Nginx reverse proxy for CLO backend
# Terminates HTTP on :80 → proxies to FastAPI on :8000
# For HTTPS/Let's Encrypt — add a server block after obtaining certs

upstream clo_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow large uploads (2MB config + some headroom)
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip for JSON responses
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1000;

    # Health check — no proxy, fast response
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # API proxy
    location / {
        proxy_pass http://clo_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering on;
        proxy_redirect off;
    }
}
