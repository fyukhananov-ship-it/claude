name: Deploy Backend to Yandex Cloud

on:
  push:
    branches: [claude/beeline-clo-mvp-xH14B, main]
    paths:
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: clo-backend
  VM_IP: ${{ secrets.VM_IP }}
  VM_USER: ${{ secrets.VM_SSH_USER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.full }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TAG="sha-${SHA_SHORT}"
          FULL="cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "Image: ${FULL}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare /opt/clo on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/clo ]; then
              sudo mkdir -p /opt/clo/deploy/nginx
              sudo chown -R $USER:$USER /opt/clo
            else
              mkdir -p /opt/clo/deploy/nginx
            fi
            ls -la /opt/clo

      - name: Copy compose and nginx files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/clo.conf"
          target: "/opt/clo"
          strip_components: 0
          overwrite: true

      - name: Compute deploy image tag
        id: deploy_meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "image=cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Pull image, run migrations, restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/clo

            IMAGE="${{ steps.deploy_meta.outputs.image }}"
            echo "Deploying image: ${IMAGE}"

            # Update BACKEND_IMAGE in clo.env
            if grep -q '^BACKEND_IMAGE=' clo.env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${IMAGE}|" clo.env
            else
              echo "BACKEND_IMAGE=${IMAGE}" >> clo.env
            fi

            # Login to Yandex Container Registry
            echo '${{ secrets.YC_SA_JSON_KEY }}' | docker login --username json_key --password-stdin cr.yandex

            # Pull new image
            docker compose -f docker-compose.prod.yml --env-file clo.env pull api

            # Run migrations
            docker compose -f docker-compose.prod.yml --env-file clo.env run --rm api alembic upgrade head

            # Restart services (nginx stays up, api is recreated)
            docker compose -f docker-compose.prod.yml --env-file clo.env up -d

            # Cleanup old images
            docker image prune -f

            # Health check
            sleep 5
            curl -fsS http://localhost/api/health && echo "OK" || (echo "HEALTH CHECK FAILED" && exit 1)
