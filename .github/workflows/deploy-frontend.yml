name: Deploy Frontend

on:
  push:
    branches: [claude/beeline-clo-mvp-xH14B, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  VM_IP: ${{ secrets.VM_IP }}
  VM_USER: ${{ secrets.VM_SSH_USER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --base=/
        env:
          VITE_API_URL: ""

      - name: Deploy to VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/opt/clo/frontend-dist"
          strip_components: 2
          overwrite: true
          rm: true

      - name: Restart nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_IP }}
          username: ${{ env.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/clo
            docker compose -f docker-compose.prod.yml restart nginx
            echo "Frontend deployed to http://${{ env.VM_IP }}"

      - name: Upload to YC Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          pip install awscli
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 sync frontend/dist/ s3://beeline-clo-static/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 cp frontend/dist/index.html s3://beeline-clo-static/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
