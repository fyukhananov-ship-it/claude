name: Deploy Frontend to YC Object Storage

on:
  push:
    branches: [claude/beeline-clo-mvp-xH14B, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build -- --base=/
        env:
          VITE_API_URL: http://${{ secrets.VM_IP }}

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to YC Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 sync frontend/dist/ s3://beeline-clo-static/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.html"

          # HTML files: no cache (so new deploys are picked up immediately)
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 cp frontend/dist/index.html s3://beeline-clo-static/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "Deployed to http://beeline-clo-static.website.yandexcloud.net"
